[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-doctor"
version = "0.1.0"
description = "A weekly fire drill for your backups: restore, verify, time it, report in plain English."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]==3.2.3",
  "PyYAML==6.0.2",
  "boto3==1.35.36",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
backup-doctor = "backup_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
