name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DRILL_SERVER_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Postgres 16 client tools (match the server)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - name: End-to-end drills (good, empty, corrupt, truncated, stale, missing table, data loss)
        run: pytest -v
      - name: Demo drill (report uploaded as an artifact)
        run: ./scripts/demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-report
          path: demo-results/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t backup-doctor:ci .
      - run: docker run --rm backup-doctor:ci --version
      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 backup-doctor:ci
